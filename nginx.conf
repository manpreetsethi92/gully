server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Links inside WhatsApp messages use the brand domain: tracked match-card
    # links (/r/<token>) and profile-verify links (/api/oauth/go/...). The
    # backend serves both; the same forwarding lives in vercel.json.
    location ~ ^/(r|api)/ {
        proxy_pass https://gully-backend.fly.dev;
        proxy_set_header Host gully-backend.fly.dev;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
